validations:
  - name: "BOOKINGS CLOSE SSOT Validation"
    # Read ONLY the table rows whose primary keys exist in the source file,
    # instead of loading the full 14M-row table. Validates exactly the source records.
    filter_target_by_source_pks: true
    source:
      type: file
      path: ./raw_data/MayBookingsCloseSSoT1.csv
    target:
      type: table
      environment: PREPROD
      schema: edw_asis
      table: bookings_ssot_manual_adjustments_v2
      where_clause: "edw_act_fl = 'Y' AND booked_date BETWEEN '2026-05-01' AND '2026-05-31'"
    primary_keys: 
    output_dir: ./results/BookingsCloseSSOT


